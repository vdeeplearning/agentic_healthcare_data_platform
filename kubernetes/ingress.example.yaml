# Example only: install and configure an ingress controller separately.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform
  namespace: agentic-healthcare
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - host: api.healthcare.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: api, port: {number: 8000}}
    - host: healthcare.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: ui, port: {number: 8501}}
    - host: airflow.healthcare.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: airflow-webserver, port: {number: 8080}}
