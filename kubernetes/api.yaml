apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: agentic-healthcare
spec:
  replicas: 1
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector:
    matchLabels: {app.kubernetes.io/name: api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: api, app.kubernetes.io/part-of: agentic-healthcare-data-platform}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: ghcr.io/vdeeplearning/agentic_healthcare_data_platform:0.1.0
          imagePullPolicy: IfNotPresent
          command: [uvicorn]
          args: [src.api.main:app, --host, 0.0.0.0, --port, "8000", --timeout-graceful-shutdown, "25"]
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - {configMapRef: {name: platform-config}}
            - {secretRef: {name: platform-secrets}}
          startupProbe: &apiProbe
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe: *apiProbe
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: lake, mountPath: /app/data/lake}
            - {name: metadata, mountPath: /app/data/metadata}
            - {name: audit, mountPath: /app/data/audit}
      volumes:
        - {name: lake, persistentVolumeClaim: {claimName: lake-data}}
        - {name: metadata, persistentVolumeClaim: {claimName: platform-metadata}}
        - {name: audit, persistentVolumeClaim: {claimName: audit-data}}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: agentic-healthcare
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: api}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: agentic-healthcare
spec:
  maxUnavailable: 0
  selector:
    matchLabels: {app.kubernetes.io/name: api}

