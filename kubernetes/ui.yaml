apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: agentic-healthcare
spec:
  replicas: 1
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector:
    matchLabels: {app.kubernetes.io/name: ui}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ui, app.kubernetes.io/part-of: agentic-healthcare-data-platform}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ui
          image: ghcr.io/vdeeplearning/agentic_healthcare_data_platform:0.1.0
          imagePullPolicy: IfNotPresent
          command: [streamlit]
          args: [run, app.py, --server.address=0.0.0.0, --server.port=8501, --server.headless=true]
          ports: [{name: http, containerPort: 8501}]
          envFrom:
            - {configMapRef: {name: platform-config}}
            - {secretRef: {name: platform-secrets}}
          startupProbe: &uiProbe
            httpGet: {path: /_stcore/health, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe: *uiProbe
          livenessProbe:
            httpGet: {path: /_stcore/health, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: metadata, mountPath: /app/data/metadata}
            - {name: audit, mountPath: /app/data/audit}
      volumes:
        - {name: metadata, persistentVolumeClaim: {claimName: platform-metadata}}
        - {name: audit, persistentVolumeClaim: {claimName: audit-data}}
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: agentic-healthcare
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: ui}
  ports: [{name: http, port: 8501, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ui
  namespace: agentic-healthcare
spec:
  maxUnavailable: 0
  selector:
    matchLabels: {app.kubernetes.io/name: ui}

