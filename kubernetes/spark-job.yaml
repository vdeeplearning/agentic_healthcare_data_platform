# Optional template. Set suspend to false only after building the referenced Spark image.
apiVersion: batch/v1
kind: Job
metadata:
  name: spark-lake-runner
  namespace: agentic-healthcare
spec:
  suspend: true
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app.kubernetes.io/name: spark-lake-runner, app.kubernetes.io/part-of: agentic-healthcare-data-platform}
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 60
      containers:
        - name: spark-runner
          image: ghcr.io/vdeeplearning/agentic_healthcare_data_platform-spark:0.1.0
          imagePullPolicy: IfNotPresent
          command: [python, -m, src.lake.cli]
          args: [--root, /app/data/lake, run-pipeline, --profile, test, --engine, spark]
          envFrom:
            - {configMapRef: {name: platform-config}}
            - {secretRef: {name: platform-secrets}}
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {cpu: "4", memory: 6Gi}
          volumeMounts:
            - {name: lake, mountPath: /app/data/lake}
            - {name: metadata, mountPath: /app/data/metadata}
            - {name: audit, mountPath: /app/data/audit}
      volumes:
        - {name: lake, persistentVolumeClaim: {claimName: lake-data}}
        - {name: metadata, persistentVolumeClaim: {claimName: platform-metadata}}
        - {name: audit, persistentVolumeClaim: {claimName: audit-data}}

