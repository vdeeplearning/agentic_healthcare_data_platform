apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: agentic-healthcare
  labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: agentic-healthcare-data-platform}
spec:
  type: ClusterIP
  clusterIP: None
  selector: {app.kubernetes.io/name: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: agentic-healthcare
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: agentic-healthcare-data-platform}
    spec:
      terminationGracePeriodSeconds: 60
      securityContext: {fsGroup: 999}
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          ports: [{name: postgres, containerPort: 5432}]
          envFrom: [{secretRef: {name: platform-secrets}}]
          startupProbe:
            exec: {command: [sh, -c, "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec: {command: [sh, -c, "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec: {command: [sh, -c, "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]}
            periodSeconds: 15
            timeoutSeconds: 5
          lifecycle:
            preStop: {exec: {command: [sh, -c, "pg_ctl -D \"$PGDATA\" -m fast stop"]}}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - {name: postgres-data, mountPath: /var/lib/postgresql/data}
            - {name: bootstrap, mountPath: /docker-entrypoint-initdb.d}
      volumes:
        - {name: bootstrap, configMap: {name: postgres-bootstrap, defaultMode: 365}}
  volumeClaimTemplates:
    - metadata: {name: postgres-data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 20Gi}

