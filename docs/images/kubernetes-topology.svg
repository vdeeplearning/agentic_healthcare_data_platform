<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" role="img" aria-labelledby="title desc"><title id="title">Kubernetes topology</title><desc id="desc">Ingress connects to API, UI, Airflow, PostgreSQL, Spark job, and persistent volumes.</desc><rect width="1440" height="720" fill="#f5f7fb"/><text x="90" y="95" font-family="Segoe UI" font-size="22" fill="#2878ff" font-weight="700">DEPLOYMENT ONLY</text><text x="90" y="155" font-family="Segoe UI" font-size="44" fill="#172033" font-weight="700">Kubernetes topology</text><text x="90" y="205" font-family="Segoe UI" font-size="21" fill="#536176">ClusterIP networking, persistent claims, probes, and bounded resources.</text><g font-family="Segoe UI" font-size="20" text-anchor="middle" font-weight="600"><rect x="80" y="320" width="170" height="85" rx="16" fill="white" stroke="#dce3ef"/><text x="165" y="372">Ingress</text><rect x="300" y="320" width="190" height="85" rx="16" fill="#1769e0"/><text x="395" y="372" fill="white">UI / API</text><rect x="540" y="320" width="170" height="85" rx="16" fill="white" stroke="#dce3ef"/><text x="625" y="372">Airflow</text><rect x="760" y="320" width="170" height="85" rx="16" fill="white" stroke="#dce3ef"/><text x="845" y="372">Spark Job</text><rect x="980" y="320" width="190" height="85" rx="16" fill="#e9f8f0" stroke="#9bd8b8"/><text x="1075" y="372">PostgreSQL</text><rect x="1220" y="320" width="140" height="85" rx="16" fill="white" stroke="#dce3ef"/><text x="1290" y="372">PVCs</text></g><g font-family="Segoe UI" font-size="32" fill="#718096"><text x="260" y="372">→</text><text x="500" y="372">→</text><text x="720" y="372">→</text><text x="940" y="372">→</text><text x="1180" y="372">→</text></g><rect x="90" y="510" width="1260" height="95" rx="14" fill="#fff7dc" stroke="#f1d889"/><text x="125" y="567" font-family="Segoe UI" font-size="20" fill="#172033">Plain manifests deploy existing services. Helm, cloud resources, and service mesh are deferred.</text></svg>
