<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" role="img" aria-labelledby="title desc"><title id="title">Airflow orchestration DAG</title><desc id="desc">Airflow coordinates source, layer quality gates, publication, and verification.</desc><rect width="1440" height="720" fill="#f5f7fb"/><text x="90" y="95" font-family="Segoe UI" font-size="22" fill="#2878ff" font-weight="700">THIN ORCHESTRATION</text><text x="90" y="155" font-family="Segoe UI" font-size="44" fill="#172033" font-weight="700">Airflow coordinates existing contracts</text><text x="90" y="205" font-family="Segoe UI" font-size="21" fill="#536176">Scheduling and retries stay separate from transformation and policy.</text><g font-family="Segoe UI" font-size="19" text-anchor="middle" font-weight="600"><rect x="60" y="310" width="150" height="85" rx="16" fill="white" stroke="#dce3ef"/><text x="135" y="362">Source</text><rect x="250" y="310" width="150" height="85" rx="16" fill="white" stroke="#dce3ef"/><text x="325" y="362">Raw</text><rect x="440" y="310" width="170" height="85" rx="16" fill="white" stroke="#dce3ef"/><text x="525" y="362">Bronze gate</text><rect x="650" y="310" width="170" height="85" rx="16" fill="white" stroke="#dce3ef"/><text x="735" y="362">Silver gate</text><rect x="860" y="310" width="170" height="85" rx="16" fill="#e9f8f0" stroke="#9bd8b8"/><text x="945" y="362">Gold gate</text><rect x="1070" y="310" width="260" height="85" rx="16" fill="#1769e0"/><text x="1200" y="362" fill="white">Publish + verify</text></g><g font-family="Segoe UI" font-size="32" fill="#718096"><text x="218" y="362">→</text><text x="408" y="362">→</text><text x="618" y="362">→</text><text x="828" y="362">→</text><text x="1038" y="362">→</text></g><rect x="90" y="510" width="1260" height="95" rx="14" fill="#fff7dc" stroke="#f1d889"/><text x="125" y="567" font-family="Segoe UI" font-size="20" fill="#172033">Python or Spark is selected through the existing factory; Airflow contains no business logic.</text></svg>
