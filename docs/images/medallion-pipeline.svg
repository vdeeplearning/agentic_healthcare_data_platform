<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" role="img" aria-labelledby="title desc"><title id="title">Medallion pipeline</title><desc id="desc">Source data flows through raw, bronze, silver, gold, and serving with quality gates.</desc><rect width="1440" height="720" fill="#f5f7fb"/><text x="90" y="95" font-family="Segoe UI" font-size="22" fill="#2878ff" font-weight="700">GOVERNED DATA LIFECYCLE</text><text x="90" y="155" font-family="Segoe UI" font-size="44" fill="#172033" font-weight="700">Raw → Bronze → Silver → Gold</text><text x="90" y="205" font-family="Segoe UI" font-size="21" fill="#536176">Versioned snapshots, deterministic quality gates, atomic publication.</text><g font-family="Segoe UI" font-size="21" text-anchor="middle" font-weight="600"><rect x="75" y="310" width="180" height="90" rx="16" fill="white" stroke="#dce3ef"/><text x="165" y="365">Source batch</text><rect x="300" y="310" width="160" height="90" rx="16" fill="white" stroke="#dce3ef"/><text x="380" y="365">Raw</text><rect x="505" y="310" width="160" height="90" rx="16" fill="white" stroke="#dce3ef"/><text x="585" y="365">Bronze</text><rect x="710" y="310" width="160" height="90" rx="16" fill="white" stroke="#dce3ef"/><text x="790" y="365">Silver</text><rect x="915" y="310" width="160" height="90" rx="16" fill="#e9f8f0" stroke="#9bd8b8"/><text x="995" y="365">Gold</text><rect x="1120" y="310" width="210" height="90" rx="16" fill="#1769e0"/><text x="1225" y="365" fill="white">Serving snapshot</text></g><g font-family="Segoe UI" font-size="34" fill="#718096"><text x="267" y="365">→</text><text x="472" y="365">→</text><text x="677" y="365">→</text><text x="882" y="365">→</text><text x="1087" y="365">→</text></g><rect x="90" y="510" width="1260" height="95" rx="14" fill="#fff7dc" stroke="#f1d889"/><text x="125" y="567" font-family="Segoe UI" font-size="20" fill="#172033">A failed candidate stops at its gate and never replaces the previous active validated snapshot.</text></svg>
