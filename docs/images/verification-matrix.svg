<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" role="img" aria-labelledby="title desc"><title id="title">Verification boundary</title><desc id="desc">Implemented, tested, statically validated, and live executed are distinct statuses.</desc><rect width="1440" height="720" fill="#f5f7fb"/><text x="90" y="95" font-family="Segoe UI" font-size="22" fill="#2878ff" font-weight="700">TRUTHFUL VERIFICATION</text><text x="90" y="155" font-family="Segoe UI" font-size="44" fill="#172033" font-weight="700">Implemented ≠ live-executed</text><text x="90" y="205" font-family="Segoe UI" font-size="21" fill="#536176">Code, contracts, static validation, and real runtimes are reported separately.</text><g font-family="Segoe UI" font-size="19" text-anchor="middle" font-weight="600"><rect x="70" y="320" width="210" height="85" rx="16" fill="#1769e0"/><text x="175" y="372" fill="white">Implemented</text><rect x="330" y="320" width="210" height="85" rx="16" fill="#e9f8f0" stroke="#9bd8b8"/><text x="435" y="372">Automated tests</text><rect x="590" y="320" width="210" height="85" rx="16" fill="white" stroke="#dce3ef"/><text x="695" y="372">Static validation</text><rect x="850" y="320" width="210" height="85" rx="16" fill="#e9f8f0" stroke="#9bd8b8"/><text x="955" y="372">Live local</text><rect x="1110" y="320" width="260" height="85" rx="16" fill="white" stroke="#dce3ef"/><text x="1240" y="360">External runtime</text><text x="1240" y="385">pending</text></g><rect x="90" y="510" width="1260" height="95" rx="14" fill="#fff7dc" stroke="#f1d889"/><text x="125" y="567" font-family="Segoe UI" font-size="20" fill="#172033">Live locally: Python, SQLite, FastAPI, Streamlit, lake, audit, lineage, and smoke demo.</text></svg>
