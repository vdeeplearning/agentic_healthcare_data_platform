[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-clinical-sql-analyst"
version = "0.1.0"
description = "A constrained, auditable natural-language healthcare SQL analyst."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "pydantic-settings>=2.2",
  "sqlglot>=25", "pandas>=2.1", "numpy>=1.26", "scipy>=1.12",
  "streamlit>=1.33", "starlette>=0.46,<1", "plotly>=5.20", "httpx>=0.27", "langgraph>=0.2", "openai>=1.40",
  "psycopg[binary]>=3.1"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
clinical-sql = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

